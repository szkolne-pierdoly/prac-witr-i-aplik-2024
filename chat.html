<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="./styl.css">
</head>
<body>
    <div class="main">
        <div class="main-row">
            <div class="col1">
                <div class="baner">
                    <h2>Chat</h2>
                </div>
                <div class="content">
                    <div class="chat">
                        <div class="message1">
                            <img src="./Jolka.png">
                            <p>Cześć, idziesz jutro do kina?</p>
                        </div>
                        <div class="message2">
                            <p>Tak! A ty?</p>
                            <img src="./Krzysiek.jpg">
                        </div>
                    </div>
                    <div class="sent-row">
                        <label>Wyślij wiadomość</label>
                        <input type="text" >
                        <button>Wyślij</button>
                    </div>
                    <button>Generuj losowa odpowiedź</button>
                </div>
            </div>
            <div class="col2">
                <h3>Chaty</h3>
                <ul>
                    <li>Ogólny</li>
                    <li>Tematyczne</li>
                    <ol>
                        <li>Turystyczny</li>
                        <li>Żeglarski</li>
                        <li>Dilatelistyczny</li>
                        <li>Hodowla zwierzatek domowych</li>
                    </ol>
                </ul>
                <h3>Uczestnicy</h3>
                <p>Jolanta Nowak</p>
                <img src="./Jolka.png" alt="Jolanta Nowak">
                <p>Krzystof Łukasnski</p>
                <img src="./Krzysiek.jpg" alt="Krzystof Łukasnski">
            </div>
        </div>
        <div class="footer">
            <h5>Chat wykonał: 00000000000</h5>
        </div>
    </div>
</body>
</html>
